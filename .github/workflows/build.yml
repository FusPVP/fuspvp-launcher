# Build reproductible du launcher FusPvP depuis ce dépôt public :
# tests, puis exécutable portable Windows (FusPvP-Launcher.exe) en artefact.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FusPvP-Launcher-${{ github.sha }}
          path: dist/FusPvP-Launcher.exe
          if-no-files-found: error
